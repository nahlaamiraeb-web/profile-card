<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Nahla Amira</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

                <h2>Nahla Amira</h2>

            </div>
        </div>

            </div>

            <div class="box">
                <p>Followers</p>
                <h3>355</h3>
            </div>

                <p>Following</p>
                <h3>360</h3>
            </div>
        </div>

        <div class="about">
            <h3>About Me</h3>
            <p>
                Hello! Aku Nahlaa
            </p>
        </div>

        <div class="buttons">
            <button id="followBtn">Follow</button>
            <button id="messageBtn">Message</button>
        </div>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>
</body>
</html>
